[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2dem"
version = "0.1.0"
description = "Uncertainty-preconditioned reconstruction of Mars DEMs from sparse laser footprints"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "FFI Research Institute contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "pandas>=2.3,<3",
  "requests>=2.32,<3",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
geo = [
  "rasterio>=1.3,<2",
  "pyproj>=3.6,<4",
  "shapely>=2,<3",
]
ml = ["torch==2.8.0"]
test = ["pytest>=8,<10"]

[project.scripts]
paper2dem = "paper2dem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
